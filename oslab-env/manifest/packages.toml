[base]
packages = [
  "ca-certificates",
  "curl",
  "wget",
  "git",
  "build-essential",
  "binutils",
  "make",
  "cmake",
  "ninja-build",
  "pkg-config",
  "bison",
  "flex",
  "bc",
  "libssl-dev",
  "libelf-dev",
  "libncurses-dev",
  "dwarves",
  "device-tree-compiler",
  "libfdt-dev",
  "file",
  "gawk",
  "gettext",
  "patch",
  "diffutils",
  "cpio",
  "rsync",
  "unzip",
  "zip",
  "xz-utils",
  "zstd",
  "clang",
  "llvm",
  "lld",
  "clang-format",
  "clang-tidy",
  "python3",
  "python3-venv",
  "python3-dev",
  "python3-pip",
  "python3-setuptools",
  "python3-pyelftools",
  "python3-pexpect",
]

[riscv_gnu]
packages = [
  "gcc-riscv64-unknown-elf",
  "binutils-riscv64-unknown-elf",
]

[qemu]
packages = [
  "qemu-system-riscv",
  "qemu-utils",
  "opensbi",
]

[debug]
packages = ["gdb", "gdb-multiarch", "strace", "ltrace", "valgrind"]

[rust]
packages = ["rustup", "cargo-binutils"]
